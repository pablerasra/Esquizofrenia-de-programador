<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuck quevedo</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input, textarea, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        #mensaje-exito { color: green; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Hola, bienvenid@ a mi whatsapp de temu en desarrollo</h2>
    <form id="miFormulario">
        <input type="text" id="nombre" placeholder="Tu nombre" required>
        <textarea id="mensaje" placeholder="Tu mensaje..." rows="4" required></textarea>
        <button type="submit">Enviar</button>
    </form>
    <p id="mensaje-exito">¡Gracias por tu mensaje! 💛 el enlace será borrado, pero la página continuará en mantenimiento</p>
</div>

<script>
    // --- BLOQUEO DE INSPECCIÓN (F12 Y CLIC DERECHO) ---
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    document.addEventListener('keydown', function(e) {
        if (
            e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
            (e.ctrlKey && e.key === 'U')
        ) {
            e.preventDefault();
        }
    });
    // --------------------------------------------------

    // --- VARIABLES DE SEGUIMIENTO EN TIEMPO REAL ---
    const tiempoInicio = Date.now(); 
    let contadorClics = 0;
    let vecesSalioPestana = 0;

    document.addEventListener('click', () => {
        contadorClics++;
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            vecesSalioPestana++;
        }
    });
    // ----------------------------------------------

    document.getElementById('miFormulario').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const mensaje = document.getElementById('mensaje').value;
        const fechaActual = new Date();
        const fechaFormateada = fechaActual.toLocaleString('es-ES');

        const tiempoEnPaginaSegundos = Math.floor((Date.now() - tiempoInicio) / 1000);
        const origen = document.referrer || "Directo / Desconocido";
        
        const agenteUsuario = navigator.userAgent;
        let dispositivo = "Ordenador";
        if (/android/i.test(agenteUsuario)) {
            dispositivo = "Móvil Android";
        } else if (/iphone|ipad|ipod/i.test(agenteUsuario)) {
            dispositivo = "Dispositivo iOS (Apple)";
        } else if (/mobile/i.test(agenteUsuario)) {
            dispositivo = "Móvil genérico";
        }

        const urlAPI = 'https://sheetdb.io/api/v1/3o550jb1149vf'; 

        // 1. Obtenemos la ciudad mediante la IP
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(ubicacionData => {
                const ciudad = ubicacionData.city ? `${ubicacionData.city} (${ubicacionData.country_name})` : 'Desconocida';

                // 2. Enviamos todos los datos a SheetDB
                return fetch(urlAPI, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: [
                            {
                                'NOMBRE': nombre,
                                'FECHA': fechaFormateada,
                                'MENSAJE': mensaje,
                                'CIUDAD': ciudad,
                                'DISPOSITIVO': dispositivo,
                                'ORIGEN': origen,
                                'TIEMPO_SEGUNDOS': tiempoEnPaginaSegundos,
                                'CLICS': contadorClics,
                                'VECES_SALIO_PESTANA': vecesSalioPestana
                            }
                        ]
                    })
                });
            })
            .then(response => {
                if (response && response.ok) {
                    document.getElementById('miFormulario').reset();
                    const mensajeExito = document.getElementById('mensaje-exito');
                    mensajeExito.style.display = 'block';
                } else {
                    alert('Hubo un error al enviar los datos.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Hubo un error al procesar la solicitud.');
            });
    });
</script>

</body>
</html>
